kind: source
spec:
  name: aws
  path: cloudquery/aws
  registry: cloudquery
  version: "v26.0.0"
  tables:
    - aws_s3_buckets
    - aws_ec2_instances
    - aws_ec2_security_groups
    - aws_ec2_vpcs
    - aws_elbv2_load_balancers
    - aws_elbv2_target_groups
    - aws_cloudfront_distributions
    - aws_route53_zones
    - aws_iam_users
    - aws_iam_roles
    - aws_iam_policies
    - aws_rds_instances
    - aws_dynamodb_tables
    - aws_kms_keys
    - aws_lambda_functions
    - aws_cloudtrail_trails
  destinations:
    - file
  spec:
    aws_debug: false
---
kind: destination
spec:
  name: file
  path: cloudquery/file
  registry: cloudquery
  version: "v5.5.10"
  write_mode: "overwrite"
  spec:
    path: "/app/reports/cloudquery/{{TABLE}}/{{UUID}}.json"
    format: "json"
